<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Portal Fiscal - BV IMM Brokers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1f35;--navy2:#152d4a;--navy3:#1a3456;
  --gold:#b89554;--gold2:#d4af70;
  --cream:#f5f0e8;--muted:rgba(245,240,232,.55);
  --bd:rgba(184,149,84,.2);--bd2:rgba(184,149,84,.35);
  --ff-display:'Cormorant Garamond',Georgia,serif;
  --ff-body:'DM Sans',sans-serif;
}
html,body{height:100%}
body{font-family:var(--ff-body);font-weight:300;background:var(--navy);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}

.wrap{width:100%;max-width:400px}

.logo-row{display:flex;align-items:center;justify-content:center;gap:.8rem;margin-bottom:.5rem}
.logo-icon{width:42px;height:42px;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:24px;height:24px;fill:var(--gold)}
.logo-text{display:flex;flex-direction:column}
.logo-text .t1{font-family:var(--ff-display);font-size:1.4rem;font-weight:600;color:var(--cream);letter-spacing:.04em;line-height:1}
.logo-text .t2{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:.2rem}

.divider{width:48px;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:1.5rem auto}

.card{background:var(--navy2);border:1px solid var(--bd);border-radius:6px;padding:2rem 2rem 1.75rem}

.card-title{font-family:var(--ff-display);font-size:1.1rem;font-weight:400;color:var(--cream);margin-bottom:1.5rem;text-align:center;letter-spacing:.02em}

.field{margin-bottom:1rem}
.field label{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.field input{width:100%;background:var(--navy);border:1px solid var(--bd);border-radius:4px;padding:.8rem 1rem;font-family:var(--ff-body);font-size:.9rem;font-weight:300;color:var(--cream);outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--gold2)}
.field input::placeholder{color:rgba(245,240,232,.25)}

.err{font-size:.72rem;color:#f87171;min-height:1.1rem;margin-bottom:.75rem;text-align:center}

.btn{width:100%;padding:.85rem;background:var(--gold);color:var(--navy);border:none;border-radius:4px;font-family:var(--ff-body);font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.note{font-size:.6rem;color:rgba(245,240,232,.25);text-align:center;margin-top:1.25rem;line-height:1.6}

.footer{margin-top:2rem;font-size:.58rem;color:rgba(245,240,232,.2);letter-spacing:.08em;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L3 7v10l9 5 9-5V7L12 2zm0 2.18L19 8v8l-7 3.88L5 16V8l7-3.82zM12 7a5 5 0 100 10A5 5 0 0012 7zm0 2a3 3 0 110 6 3 3 0 010-6z"/></svg>
    </div>
    <div class="logo-text">
      <span class="t1">BV IMM Brokers</span>
      <span class="t2">Portal Fiscal</span>
    </div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="card-title">Autentificare</div>
    <div class="field">
      <label>Utilizator</label>
      <input type="text" id="u" placeholder="utilizator" autocomplete="username"
             onkeydown="if(event.key==='Enter')document.getElementById('p').focus()">
    </div>
    <div class="field">
      <label>Parola</label>
      <input type="password" id="p" placeholder="parola" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="btn" onclick="doLogin()">Autentificare</button>
    <div class="note">Acces restrictionat - uz intern BV IMM Brokers</div>
  </div>
  <div class="footer">brasovbrokers.ro &mdash; Portal Fiscal</div>
</div>
<script>
const TK = 'bvimm_token_v1';
const API = 'https://portal-fiscal-brasov-brokers.ovidiu-clipa.workers.dev';

async function doLogin(){
  const user=document.getElementById('u').value.trim();
  const pass=document.getElementById('p').value;
  const errEl=document.getElementById('err');
  const btn=document.getElementById('btn');
  if(!user||!pass){errEl.textContent='Completati ambele campuri.';return;}
  btn.disabled=true;btn.textContent='Se verifica...';
  try{
    const r=await fetch(API+'/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,password:pass})
    });
    const d=await r.json();
    if(!d.success){errEl.textContent=d.error?.message||'Credentiale incorecte.';document.getElementById('p').value='';document.getElementById('p').focus();return;}
    localStorage.setItem(TK,JSON.stringify({token:d.data.token,user:d.data.username,role:d.data.role,exp:Date.now()+8*3600*1000}));
    window.location.href='./index.html';
  }catch(e){errEl.textContent='Eroare conexiune: '+e.message;}
  finally{btn.disabled=false;btn.textContent='Autentificare';}
}
</script>
</body>
</html>
